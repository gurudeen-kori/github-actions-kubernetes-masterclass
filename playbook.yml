- name: Setup EC2 with Docker and App Config
  hosts: web
  become: true

  vars:
    app_dir: /home/ubuntu/skillpulse

  tasks:

    - name: Update apt packages
      apt:
        update_cache: yes

    # ✅ Install Docker (same as curl script)
    - name: Install Docker dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add Docker GPG key
      shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc

    - name: Add Docker repo
      shell: |
        echo \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
        $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
        > /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      apt:
        update_cache: yes
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: true

    # ✅ Add user to docker group (like: usermod -aG docker $USER)
    - name: Add ubuntu user to docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    # ✅ Create project directory
    - name: Create skillpulse directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    # ✅ Create .env file
    - name: Create .env file
      copy:
        dest: "{{ app_dir }}/.env"
        content: |
          MYSQL_ROOT_PASSWORD=rootpassword123
          DB_HOST=db
          DB_PORT=3306
          DB_USER=skillpulse
          DB_PASSWORD=skillpulse123
          DB_NAME=skillpulse
          DOCKERHUB_USERNAME=your-docker-hub-username
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    # ✅ Verify Docker (docker ps)
    - name: Check docker running
      command: docker ps
      register: docker_output

    - name: Show docker output
      debug:
        var: docker_output.stdout