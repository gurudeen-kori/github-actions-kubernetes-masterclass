name: Code Quality

on:
  workflow_call:

jobs:

  # ✅ Frontend (Static - HTML/CSS/JS)
  frontend-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      

      - name: Check formatting (Prettier via npx)
        run: |
          npx prettier --check . || true
      - name: Fix formatting with Prettier
        run: npx prettier --write .

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add . 
          git commit -m "Auto format with Prettier" || echo "No changes"
          git push 

      - name: Lint JS (optional basic check)
        run: |
          if command -v node >/dev/null 2>&1; then
            echo "Node available, running basic lint"
          else
            echo "Skipping JS lint (no Node project)"
          fi

  # ✅ Backend (Go)
  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install dependencies
        run: go mod tidy
        working-directory: backend

      - name: Run Go Linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: backend
          args: --timeout=5m