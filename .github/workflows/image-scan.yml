name: Image scanner

on:
  workflow_call: 
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  image-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # FIXED: Swapped out mismatched names to match the inputs declared above exactly
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Note: Removed the manual Trivy installation apt steps since the action below handles it natively

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0 # Fixed the version prefix to prevent resolution errors
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/skillpulse-backend:latest
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0 # Fixed all version prefix to prevent resolution errors
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/skillpulse-frontend:latest
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
